name: Merge JSONC

on:
    push:
        branches:
            - '**'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: merge-jsonc-${{ github.ref }}
    cancel-in-progress: false

jobs:
    merge:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref_name }}

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Install JSONC-compatible parser
              run: python -m pip install json5==0.12.1

            - name: Merge tracked JSONC files
              shell: python
              run: |
                import json
                import subprocess
                from pathlib import Path

                import json5

                paths = sorted(
                    path for path in subprocess.check_output(
                        ['git', 'ls-files', '-z'], text=True
                    ).split('\0')
                    if path.endswith('.jsonc')
                )
                if not paths:
                    raise SystemExit('No JSONC files found')

                merged = {}
                sources = {}
                for path in paths:
                    data = json5.loads(
                        Path(path).read_text(encoding='utf-8'),
                        allow_duplicate_keys=False,
                    )
                    if not isinstance(data, dict):
                        raise ValueError(f'{path}: expected a JSON object')
                    for key, value in data.items():
                        if key in merged:
                            raise ValueError(
                                f'Duplicate key {key!r} in {sources[key]} and {path}'
                            )
                        merged[key] = value
                        sources[key] = path

                Path('data.json').write_text(
                    json.dumps(merged, ensure_ascii=False, indent=2, sort_keys=True,
                                allow_nan=False) + '\n',
                    encoding='utf-8',
                )
                print(f'Merged {len(paths)} files into data.json ({len(merged)} entries)')

            - name: Commit and push data.json if changed
              env:
                  BRANCH: ${{ github.ref_name }}
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add -- data.json
                  if git diff --cached --quiet; then
                      echo 'data.json is already up to date'
                      exit 0
                  fi
                  git commit -m 'chore: update data.json'
                  git push origin "HEAD:refs/heads/$BRANCH"
